<mat-card class="mat-card-margin">
    <mat-card-title class="plantillas-title">Generar plantillas</mat-card-title>

    <mat-card-content>
        <form [formGroup]="plantillaForm">
            <div class="panel">

                <div class="infoGeneral">
                    <mat-form-field *ngIf="plantillaForm">
                        <mat-label>Nombre de la plantilla</mat-label>
                        <input matInput formControlName="nombre">
                    </mat-form-field>
                    <mat-form-field *ngIf="plantillaForm">
                        <mat-label>Tipo de plantilla</mat-label>
                        <mat-select formControlName="tipo">
                            <mat-option *ngFor="let tipo of tiposPlantilla" [value]="tipo">{{ tipo }}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div style="width: 100%;">
                    <div class="titulo">Editor</div>
                </div>
            </div>

            <div class="row">
                <button mat-raised-button type="button" (click)="guardarPlantilla()">
                    Guardar plantilla
                </button>
                <button mat-raised-button type="button" (click)="generarPdf()" [disabled]="sendDisabled">
                    Generar pdf
                </button>
                <button mat-raised-button type="button" (click)="registrarPlantilla()" [disabled]="sendDisabled">
                    Registrar plantilla
                </button>
            </div>

        </form>
    </mat-card-content>
</mat-card>

<pre> {{ plantillaForm.value | json }} </pre>
